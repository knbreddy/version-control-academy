button,input,select{font:inherit}button{cursor:pointer}a{color:var(--accent)}.layout{min-height:100vh;display:grid;grid-template-columns:260px minmax(0,1fr)}

.brand{font-size:22px;font-weight:800;line-height:1.15}.brand span{color:var(--accent)}.brand small{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:10px}
nav{display:grid;gap:7px}nav button{width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:12px 14px;color:var(--muted)}

main{max-width:1200px;margin:0 auto;padding:38px 5vw 80px}header{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:28px}.eyebrow{font-weight:700;color:var(--accent);font-size:12px;letter-spacing:.13em;text-transform:uppercase}
h1{font-size:clamp(30px,5vw,51px);line-height:1.1;margin:12px 0}h2{font-size:25px;margin:25px 0 12px}h3{font-size:18px;margin:0 0 8px}.muted{color:var(--muted)}.intro{max-width:740px;color:var(--muted);font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px;margin:22px 0}.card,.panel{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:21px}.card{transition:background .2s,border-color .2s}.card:hover{border-color:#4d7885}.pill{border-radius:30px;background:#1a3b3c;color:#8ef1ce;padding:4px 10px;font-size:11px;font-weight:700;display:inline-block}
.tag{border:1px solid #3f5063;border-radius:30px;color:var(--muted);padding:3px 9px;font-size:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
button.primary{background:var(--accent);color:#08271f;border:0;border-radius:9px;padding:11px 16px;font-weight:750}button.secondary,.fileinput{background:#24364a;color:var(--text);border:1px solid #42536a;border-radius:9px;padding:9px 13px}

.checkbox{accent-color:var(--accent);width:17px;height:17px}.command{font-family:ui-monospace,Consolas,monospace;padding:12px;background:#080f1c;border-radius:9px;color:#c1dafa;overflow-wrap:anywhere}
.flash{min-height:245px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:15px;border:1px solid #426c72;border-radius:18px;background:linear-gradient(145deg,#213449,#102936);padding:30px;cursor:pointer}

.hero{background:linear-gradient(125deg,#1b3640,#132236);border-color:#3e776d;padding:30px;margin-top:26px}

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function progress(){let a=DATA.modules.reduce((n,m)=>n+m.lessons.filter((_,i)=>state.lessons[m.id+"-"+i]).length,0),b=DATA.labs.filter(l=>state.labs[l.id]).length;return Math.round(100*(a+b)/(DATA.modules.length*4+DATA.labs.length))}
function updateProgress(){let p=progress();document.getElementById("progressLabel").textContent=p+"%";document.getElementById("progressMeter").style.width=p+"%"}
function nav(name){view=name;document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===(name==="lesson"?"roadmap":name)));render();window.scrollTo({top:0,behavior:"smooth"})}
function viewHeading(title,description){return '<h1>'+title+'</h1><p class="intro">'+description+'</p>'}
let selectedLesson=0;
function allLessons(){return DATA.modules.flatMap(m=>m.lessons.map((l,i)=>({module:m,lesson:l,idx:i,id:m.id+"-"+i})))}
function nextLesson(){let ls=allLessons();return Math.max(0,ls.findIndex(l=>!state.lessons[l.id]))}
function showLesson(i){selectedLesson=Math.max(0,Math.min(i,allLessons().length-1));nav("lesson")}
function overview(){
const ls=allLessons(),n=nextLesson(),done=ls.filter(l=>state.lessons[l.id]).length,labsDone=DATA.labs.filter(l=>state.labs[l.id]).length;
return '<span class="pill">START WITH GIT · NO ACCOUNT NEEDED</span>'+
viewHeading("Learn Git, one step at a time.","Simple explanations, real examples, short practice tasks and flashcards. Start from zero and build confidence toward GitHub Actions.")+
'<div class="hero panel"><div class="eyebrow">YOUR NEXT LESSON · '+(n+1)+' OF '+ls.length+'</div><h2>'+esc(ls[n].lesson.title)+'</h2><p class="muted">'+esc(ls[n].lesson.summary)+'</p><button class="primary" data-lessonopen="'+n+'">'+(done?'Continue learning →':'Start learning →')+'</button><span class="muted" style="margin-left:12px;font-size:13px">About 5–10 min</span><div class="heroSecondary"><a href="./playground.html">Or start by trying Git commands in your browser →</a></div></div>'+
'<div class="grid compactstats">'+[[''+done+' / '+ls.length,'Lessons learned'],[''+labsDone+' / '+DATA.labs.length,'Labs verified'],[''+DATA.cards.length,'Practice flashcards']].map(x=>'<div class="card"><strong class="bigNumber">'+x[0]+'</strong><div class="muted">'+x[1]+'</div></div>').join('')+'</div>'+
'<h2>Three simple stages</h2><div class="grid">'+[['01 · GIT','Learn commits, history, branches and remotes.','Git fundamentals'],['02 · GITHUB','Collaborate through issues, pull requests and reviews.','GitHub collaboration'],['03 · ACTIONS','Automate testing, deployment and security.','GitHub Actions basics']].map(x=>'<div class="card"><span class="eyebrow">'+x[0]+'</span><p class="muted">'+x[1]+'</p><button class="secondary" data-findmodule="'+x[2]+'">View lessons →</button></div>').join('')+'</div>';
}
function playgroundView(){return viewHeading("Try Git in your browser","A safe practice terminal where you type Git commands, see file changes, and complete your first commit. No installation or sign-in.")+
'<div class="hero panel"><span class="eyebrow">INTERACTIVE · BEGINNER</span><h2>Your first Git repository</h2><p class="muted">8 guided steps: initialize → inspect → create a file → edit → stage → compare → commit → view history.</p><a class="bigCTA" href="./playground.html">Open the interactive Git playground →</a><p class="muted" style="margin-top:14px">Runs locally in your browser. This is a simulation of a subset of Git commands, not a real shell.</p></div>'}
function roadmap(){
return viewHeading("Your learning path","Choose a lesson to read it in a focused view. Every lesson has one explanation, one example, and one check.")+
DATA.modules.map((m,mi)=>'<section class="panel modulePanel" style="margin-top:14px"><div class="row"><h2 style="margin:0;font-size:21px">'+String(mi+1).padStart(2,'0')+' · '+esc(m.title)+'</h2><span class="tag">'+esc(m.level)+'</span></div>'+
'<div class="pathItems">'+m.lessons.map((l,i)=>{let index=(mi*4)+i,id=m.id+"-"+i;return '<button class="pathItem" data-lessonopen="'+index+'"><span class="stepCircle">'+(state.lessons[id]?'✓':String(i+1))+'</span><span class="pathLabel"><strong>'+esc(l.title)+'</strong><small>'+esc(l.summary)+'</small></span><span class="pathArrow">→</span></button>'}).join('')+'</div></section>').join('')}
function lessonView(){
let ls=allLessons(),item=ls[selectedLesson],guide=VCA_GUIDES.lessons[selectedLesson],pos=selectedLesson,completed=!!state.lessons[item.id];
return '<button class="secondary" data-backroadmap="1">← All lessons</button>'+
'<div class="lessonPage"><span class="eyebrow">'+esc(item.module.title)+' · LESSON '+(pos+1)+' / '+ls.length+'</span>'+
'<h1>'+esc(item.lesson.title)+'</h1><p class="intro">'+esc(item.lesson.summary)+'</p>'+
'<div class="panel"><div class="eyebrow">01 · UNDERSTAND</div><h2>Here is how it works</h2><p class="teaching">'+esc(guide[0])+'</p></div>'+
'<div class="panel"><div class="eyebrow">02 · SEE IT IN ACTION</div><h2>Example</h2><div class="example">'+esc(guide[1])+'</div></div>'+
(pos<4?'<div class="panel tryPanel"><div class="eyebrow">PRACTICE IT</div><h2>Type the commands yourself</h2><p>Use the interactive Git playground to create a repository, stage a file and inspect your first commit.</p><a class="bigCTA" href="./playground.html">Launch Git playground →</a></div>':'')+
'<div class="panel"><div class="eyebrow">03 · CHECK YOURSELF</div><h2>Can you answer this?</h2><p class="teaching">'+esc(guide[2])+'</p><p class="muted">Try explaining it in your own words before continuing.</p></div>'+
'<div class="panel lessonEnd"><label class="doneCheck"><input type="checkbox" class="checkbox" data-lesson="'+item.id+'" '+(completed?'checked':'')+'> I understand this lesson</label>'+
'<div class="actions"><button class="secondary" data-prevlesson="'+(pos-1)+'" '+(pos===0?'disabled':'')+'>← Previous</button><button class="secondary" data-labmodule="'+item.module.id+'">Try a lab</button><button class="primary" data-nextlesson="'+(pos+1)+'" '+(pos===ls.length-1?'disabled':'')+'>Next lesson →</button></div></div></div>';
}
function labsView(){
let filter=['<option value="all">All modules</option>'].concat(DATA.modules.map(m=>'<option value="'+m.id+'" '+(selectedModule==m.id?"selected":"")+'>'+esc(m.title)+'</option>')).join('');
return viewHeading("Guided hands-on labs","Follow the steps in order, compare results with the expected outcome, and only then mark the lab verified. Use a disposable practice repository.")+
'<div class="panel labIntro"><strong>Getting started</strong><p>Install <a href="https://git-scm.com/downloads" target="_blank" rel="noopener">Git</a> and open your terminal. For GitHub and Actions modules, create your own public practice repository on GitHub. Never run destructive commands in a production project.</p>'+
'<p class="muted">Commands containing &lt;sha&gt;, &lt;file&gt;, &lt;repository-url&gt; or similar placeholders must be replaced with real values.</p></div>'+
'<div class="panel" style="margin-top:15px"><label for="filter"><strong>Choose a module</strong></label><select class="search" id="filter">'+filter+'</select></div>'+
'<div class="labGrid">'+DATA.labs.filter(l=>selectedModule==="all"||String(l.module)===selectedModule).map((l)=>{let g=VCA_GUIDES.labs.find(x=>x.id===l.id);return '<article class="panel labPanel"><div class="row"><span class="tag">MODULE '+l.module+'</span><span class="tag">'+esc(l.level)+'</span></div><h3 style="margin-top:14px">'+esc(l.title)+'</h3><p class="muted"><strong>Before you start:</strong> '+esc(g.prereq)+'</p><details class="learningDetails"><summary><strong>Open step-by-step instructions</strong><span class="chevron">⌄</span></summary><div class="learningBody"><ol class="stepList">'+g.steps.map(step=>'<li>'+esc(step)+'</li>').join('')+'</ol><h3>Command or configuration to explore</h3><div class="command">'+esc(l.command)+'</div><h3>Verify your result</h3><p>'+esc(g.expected)+'</p><p class="muted">If the outcome differs, read the command output and correct the issue before marking complete.</p></div></details><label class="doneCheck" style="margin-top:16px"><input type="checkbox" class="checkbox" data-lab="'+l.id+'" '+(state.labs[l.id]?"checked":"")+'> I completed and verified this lab</label></article>'}).join('')+'</div>'
}
let selectedTopic="All topics",missedOnly=false;
function cardIds(){let ids=DATA.cards.map((_,i)=>i).filter(i=>selectedTopic==="All topics"||DATA.cards[i].topic===selectedTopic);if(missedOnly)ids=ids.filter(i=>state.review[i]==="missed");return ids}
function flashcards(){
const ids=cardIds();if(!ids.length)return viewHeading("Flashcards","There are no missed cards in this topic.")+'<button class="secondary" id="clearFilter">Show all cards</button>';
if(!ids.includes(currentCard))currentCard=ids[0];const c=DATA.cards[currentCard];
const known=Object.values(state.review).filter(x=>x==="known").length,missed=Object.values(state.review).filter(x=>x==="missed").length;
return viewHeading("Flashcards","Test recall, flip to reveal the answer, then rate yourself. Your progress stays on this device.")+
'<div class="row" style="margin:20px 0"><label for="topic">Topic: <select id="topic" class="search">'+['All topics',...DATA.modules.map(m=>m.title)].map(t=>'<option '+(selectedTopic===t?'selected':'')+'>'+esc(t)+'</option>').join('')+'</select></label><span class="tag">'+known+' known · '+missed+' missed</span></div>'+
'<div class="row" style="margin:16px 0"><span class="tag">Card '+(ids.indexOf(currentCard)+1)+' of '+ids.length+'</span><span class="tag">'+esc(c.topic)+'</span></div>'+
'<div class="flash" id="flash" role="button" tabindex="0" aria-pressed="'+revealed+'" aria-label="Flip flashcard"><small>'+(revealed?'ANSWER':'QUESTION · TAP TO FLIP')+'</small><strong>'+esc(revealed?c.back:c.front)+'</strong><small>Click or press Enter to flip</small></div>'+
'<div class="actions"><button class="secondary" id="prev">← Previous</button><button class="secondary" id="flip">Flip</button><button class="secondary" id="next">Next →</button></div>'+
'<div class="actions"><button class="secondary" id="miss">× Needs review</button><button class="primary" id="known">✓ I know this</button></div>'+
'<div class="actions"><button class="secondary" id="reviewMissed">'+(missedOnly?'Show all cards':'Review missed ('+missed+')')+'</button><button class="secondary" id="shuffle">Random card</button></div>';
}

function resources(){return viewHeading("Official resources","Use primary documentation while completing labs.")+'<div class="grid">'+[
["Pro Git Book","https://git-scm.com/book/en/v2"],
["Git Reference","https://git-scm.com/docs"],
["GitHub Skills","https://skills.github.com/"],
["GitHub Pull Requests","https://docs.github.com/en/pull-requests"],
["GitHub Actions","https://docs.github.com/en/actions"],
["GitHub Pages","https://docs.github.com/en/pages"],
["Actions Security","https://docs.github.com/en/actions/security-guides"]
].map(r=>'<a class="card" href="'+r[1]+'" target="_blank" rel="noopener"><strong>'+r[0]+'</strong><p class="muted">Open documentation ↗</p></a>').join("")+'</div>'}
function cardNav(delta){let ids=cardIds();let pos=ids.indexOf(currentCard);currentCard=ids[(pos+delta+ids.length)%ids.length];revealed=false;render()}
function render(){document.getElementById("content").innerHTML=({overview,roadmap,lesson:lessonView,labs:labsView,playground:playgroundView,flashcards,resources})[view]();updateProgress();
document.querySelectorAll("[data-lesson]").forEach(x=>x.onchange=()=>{state.lessons[x.dataset.lesson]=x.checked;save()});
document.querySelectorAll("[data-lab]").forEach(x=>x.onchange=()=>{state.labs[x.dataset.lab]=x.checked;save()});
document.querySelectorAll("[data-go]").forEach(x=>x.onclick=()=>nav(x.dataset.go));
document.querySelectorAll("[data-openlabs]").forEach(x=>x.onclick=()=>{selectedModule=x.dataset.openlabs;nav("labs")});
document.querySelectorAll("[data-lessonopen]").forEach(x=>x.onclick=()=>showLesson(Number(x.dataset.lessonopen)));
document.querySelectorAll("[data-findmodule]").forEach(x=>x.onclick=()=>{let i=allLessons().findIndex(l=>l.module.title===x.dataset.findmodule);showLesson(i)});
document.querySelectorAll("[data-nextlesson]").forEach(x=>x.onclick=()=>showLesson(Number(x.dataset.nextlesson)));
document.querySelectorAll("[data-prevlesson]").forEach(x=>x.onclick=()=>showLesson(Number(x.dataset.prevlesson)));
document.querySelectorAll("[data-backroadmap]").forEach(x=>x.onclick=()=>nav("roadmap"));
document.querySelectorAll("[data-labmodule]").forEach(x=>x.onclick=()=>{selectedModule=x.dataset.labmodule;nav("labs")});
let f=document.getElementById("filter");if(f)f.onchange=()=>{selectedModule=f.value;render()};
let clear=document.getElementById("clearFilter");if(clear)clear.onclick=()=>{missedOnly=false;render()};
if(view==="flashcards"&&!clear){
let topic=document.getElementById("topic");topic.onchange=()=>{selectedTopic=topic.value;missedOnly=false;currentCard=cardIds()[0];revealed=false;render()};
let el=document.getElementById("flash");const flip=()=>{revealed=!revealed;render();document.getElementById("flash").focus()};
el.onclick=flip;el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();flip()}};
document.getElementById("flip").onclick=flip;document.getElementById("prev").onclick=()=>cardNav(-1);document.getElementById("next").onclick=()=>cardNav(1);
for(let rating of ["known","missed"]){document.getElementById(rating==="known"?"known":"miss").onclick=()=>{let ids=cardIds(),pos=ids.indexOf(currentCard);state.review[currentCard]=rating;save();let next=cardIds();currentCard=next.length?next[(Math.min(pos+1,next.length-1))%next.length]:currentCard;revealed=false;render()}}
document.getElementById("shuffle").onclick=()=>{let ids=cardIds();currentCard=ids[Math.floor(Math.random()*ids.length)];revealed=false;render()};
document.getElementById("reviewMissed").onclick=()=>{missedOnly=!missedOnly;let ids=cardIds();if(ids.length)currentCard=ids[0];revealed=false;render()};
}}

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>nav(b.dataset.view));
document.getElementById("export").onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="academy-progress.json";a.click();URL.revokeObjectURL(a.href)};
document.getElementById("import").onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(!obj||typeof obj!=="object"||!obj.lessons||!obj.labs)throw Error();state={lessons:obj.lessons,labs:obj.labs,review:obj.cardDeckVersion===2?(obj.review||{}):{},cardDeckVersion:2};save();render();alert("Progress imported.")}catch(err){alert("Invalid progress file.")}};
render();
</script></body></html>
