'<div class="actions"><button class="secondary" id="reviewMissed">Review missed</button><button class="secondary" id="shuffle">Shuffle / start</button></div>'}
function resources(){return viewHeading("Official resources","Use primary documentation while completing labs.")+'<div class="grid">'+[
["GNU CVS Manual","https://www.gnu.org/software/trans-coord/manual/cvs/cvs.html"],
["Pro Git Book","https://git-scm.com/book/en/v2"],
["Git Reference","https://git-scm.com/docs"],
["GitHub Skills","https://skills.github.com/"],
["GitHub Pull Requests","https://docs.github.com/en/pull-requests"],
["GitHub Actions","https://docs.github.com/en/actions"],
["GitHub Pages","https://docs.github.com/en/pages"],
["Actions Security","https://docs.github.com/en/actions/security-guides"]
].map(r=>'<a class="card" href="'+r[1]+'" target="_blank" rel="noopener"><strong>'+r[0]+'</strong><p class="muted">Open documentation ↗</p></a>').join("")+'</div>'}
function cardNav(delta){currentCard=(currentCard+delta+DATA.cards.length)%DATA.cards.length;revealed=false;render()}
function render(){document.getElementById("content").innerHTML=({overview,roadmap,labs:labsView,flashcards,resources})[view]();updateProgress();
document.querySelectorAll("[data-lesson]").forEach(x=>x.onchange=()=>{state.lessons[x.dataset.lesson]=x.checked;save()});
document.querySelectorAll("[data-lab]").forEach(x=>x.onchange=()=>{state.labs[x.dataset.lab]=x.checked;save()});
let f=document.getElementById("filter");if(f)f.onchange=()=>{selectedModule=f.value;render()};
if(view==="flashcards"){function flip(){revealed=!revealed;render()}let el=document.getElementById("flash");el.onclick=flip;el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();flip()}};document.getElementById("flip").onclick=flip;
document.getElementById("prev").onclick=()=>cardNav(-1);document.getElementById("next").onclick=()=>cardNav(1);
for(let rating of ["known","missed"]){document.getElementById(rating==="known"?"known":"miss").onclick=()=>{state.review[currentCard]=rating;save();cardNav(1)}}
document.getElementById("shuffle").onclick=()=>{currentCard=Math.floor(Math.random()*DATA.cards.length);revealed=false;render()};
document.getElementById("reviewMissed").onclick=()=>{let idx=DATA.cards.findIndex((_,i)=>state.review[i]==="missed");if(idx<0){alert("No missed cards yet.");return}currentCard=idx;revealed=false;render()}}}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>nav(b.dataset.view));
document.getElementById("export").onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="academy-progress.json";a.click();URL.revokeObjectURL(a.href)};
document.getElementById("import").onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(!obj||typeof obj!=="object"||!obj.lessons||!obj.labs)throw Error();state={lessons:obj.lessons,labs:obj.labs,review:obj.review||{}};save();render();alert("Progress imported.")}catch(err){alert("Invalid progress file.")}};
render();
</script></body></html>
