'<div class="grid">'+items.map(i=>'<div class="card"><div style="font-size:35px;font-weight:800;color:var(--accent)">'+i[0]+'</div><div class="muted">'+i[1]+'</div></div>').join("")+'</div>'+
'<div class="panel"><h2 class="sectionTitle">Your learning journey</h2><p class="muted">CVS foundations → Git internals → GitHub collaboration → Actions CI/CD → production-quality automation.</p><div class="row"><button class="primary" data-go="roadmap">Explore the roadmap</button><button class="secondary" data-go="labs">Start practicing</button></div></div>'+
'<h2>Learning stages</h2><div class="grid">'+[["Foundations","History, CVS, snapshots and branching"],["Collaboration","GitHub PRs, reviews and governance"],["Automation","CI checks, workflows, permissions and deployment"]].map((x,i)=>'<div class="card"><span class="tag">STAGE '+(i+1)+'</span><h3 style="margin-top:12px">'+x[0]+'</h3><p class="muted">'+x[1]+'</p></div>').join("")+'</div>'}

function roadmap(){
return viewHeading("Learn the theory","Read the explanation, study the worked example, answer the check question, then mark the lesson complete. Each topic expands into a real lesson.")+
'<div class="panel" style="margin:22px 0"><strong>How to study</strong><p class="muted">1. Read the concept → 2. Try the example → 3. Answer the check → 4. Complete the corresponding hands-on lab. Start at module 1 if you are new to source control.</p></div>'+
DATA.modules.map(m=>'<section class="panel modulePanel" style="margin-top:18px"><div class="row"><h2 style="margin:0">'+String(m.id).padStart(2,'0')+'. '+esc(m.title)+'</h2><span class="tag">'+esc(m.level)+'</span></div><p class="muted">Module '+m.id+' · 4 lessons · '+DATA.labs.filter(l=>l.module===m.id).length+' practical labs</p>'+
m.lessons.map((l,i)=>{let id=m.id+"-"+i,guide=VCA_GUIDES.lessons[(m.id-1)*4+i],summary=guide[0],example=guide[1],question=guide[2];
return '<details class="learningDetails"><summary><span><strong>'+esc(l.title)+'</strong><span class="muted subline">'+esc(l.summary)+'</span></span><span class="chevron">⌄</span></summary>'+
'<div class="learningBody"><h3>Understand the concept</h3><p>'+esc(summary)+'</p><h3>Worked example</h3><div class="example">'+esc(example)+'</div><h3>Check your understanding</h3><p>'+esc(question)+'</p>'+
'<div class="row" style="margin-top:18px"><label class="doneCheck"><input type="checkbox" class="checkbox" data-lesson="'+id+'" '+(state.lessons[id]?"checked":"")+'> I understand this lesson</label><button class="secondary" data-openlabs="'+m.id+'">Practice this module →</button></div></div></details>'}).join('')+'</section>').join('')
}
function labsView(){
let filter=['<option value="all">All modules</option>'].concat(DATA.modules.map(m=>'<option value="'+m.id+'" '+(selectedModule==m.id?"selected":"")+'>'+esc(m.title)+'</option>')).join('');
return viewHeading("Guided hands-on labs","Follow the steps in order, compare results with the expected outcome, and only then mark the lab verified. Use a disposable practice repository.")+
'<div class="panel labIntro"><strong>Getting started</strong><p>Install <a href="https://git-scm.com/downloads" target="_blank" rel="noopener">Git</a> and open your terminal. For modules 5–10, create your own public practice repository on GitHub. Never run destructive commands in a production project.</p>'+
'<p class="muted">Commands containing &lt;sha&gt;, &lt;file&gt;, &lt;repository-url&gt; or similar placeholders must be replaced with real values. CVS exercises are conceptual unless you have access to a CVS server.</p></div>'+
'<div class="panel" style="margin-top:15px"><label for="filter"><strong>Choose a module</strong></label><select class="search" id="filter">'+filter+'</select></div>'+
'<div class="labGrid">'+DATA.labs.filter(l=>selectedModule==="all"||String(l.module)===selectedModule).map((l)=>{let g=VCA_GUIDES.labs.find(x=>x.id===l.id);return '<article class="panel labPanel"><div class="row"><span class="tag">MODULE '+l.module+'</span><span class="tag">'+esc(l.level)+'</span></div><h3 style="margin-top:14px">'+esc(l.title)+'</h3><p class="muted"><strong>Before you start:</strong> '+esc(g.prereq)+'</p><details class="learningDetails"><summary><strong>Open step-by-step instructions</strong><span class="chevron">⌄</span></summary><div class="learningBody"><ol class="stepList">'+g.steps.map(step=>'<li>'+esc(step)+'</li>').join('')+'</ol><h3>Command or configuration to explore</h3><div class="command">'+esc(l.command)+'</div><h3>Verify your result</h3><p>'+esc(g.expected)+'</p><p class="muted">If the outcome differs, read the command output and correct the issue before marking complete.</p></div></details><label class="doneCheck" style="margin-top:16px"><input type="checkbox" class="checkbox" data-lab="'+l.id+'" '+(state.labs[l.id]?"checked":"")+'> I completed and verified this lab</label></article>'}).join('')+'</div>'
}
let selectedTopic="All topics",missedOnly=false;
function cardIds(){let ids=DATA.cards.map((_,i)=>i).filter(i=>selectedTopic==="All topics"||DATA.cards[i].topic===selectedTopic);if(missedOnly)ids=ids.filter(i=>state.review[i]==="missed");return ids}
function flashcards(){
const ids=cardIds();if(!ids.length)return viewHeading("Flashcards","There are no missed cards in this topic.")+'<button class="secondary" id="clearFilter">Show all cards</button>';
if(!ids.includes(currentCard))currentCard=ids[0];const c=DATA.cards[currentCard];
const known=Object.values(state.review).filter(x=>x==="known").length,missed=Object.values(state.review).filter(x=>x==="missed").length;
return viewHeading("Flashcards","Test recall, flip to reveal the answer, then rate yourself. Your progress stays on this device.")+
'<div class="row" style="margin:20px 0"><label for="topic">Topic: <select id="topic" class="search">'+['All topics',...DATA.modules.map(m=>m.title)].map(t=>'<option '+(selectedTopic===t?'selected':'')+'>'+esc(t)+'</option>').join('')+'</select></label><span class="tag">'+known+' known · '+missed+' missed</span></div>'+
'<div class="row" style="margin:16px 0"><span class="tag">Card '+(ids.indexOf(currentCard)+1)+' of '+ids.length+'</span><span class="tag">'+esc(c.topic)+'</span></div>'+
'<div class="flash" id="flash" role="button" tabindex="0" aria-pressed="'+revealed+'" aria-label="Flip flashcard"><small>'+(revealed?'ANSWER':'QUESTION · TAP TO FLIP')+'</small><strong>'+esc(revealed?c.back:c.front)+'</strong><small>Click or press Enter to flip</small></div>'+
'<div class="actions"><button class="secondary" id="prev">← Previous</button><button class="secondary" id="flip">Flip</button><button class="secondary" id="next">Next →</button></div>'+
'<div class="actions"><button class="secondary" id="miss">× Needs review</button><button class="primary" id="known">✓ I know this</button></div>'+
'<div class="actions"><button class="secondary" id="reviewMissed">'+(missedOnly?'Show all cards':'Review missed ('+missed+')')+'</button><button class="secondary" id="shuffle">Random card</button></div>';
}

function resources(){return viewHeading("Official resources","Use primary documentation while completing labs.")+'<div class="grid">'+[
["GNU CVS Manual","https://www.gnu.org/software/trans-coord/manual/cvs/cvs.html"],
["Pro Git Book","https://git-scm.com/book/en/v2"],
["Git Reference","https://git-scm.com/docs"],
["GitHub Skills","https://skills.github.com/"],
["GitHub Pull Requests","https://docs.github.com/en/pull-requests"],
["GitHub Actions","https://docs.github.com/en/actions"],
["GitHub Pages","https://docs.github.com/en/pages"],
["Actions Security","https://docs.github.com/en/actions/security-guides"]
].map(r=>'<a class="card" href="'+r[1]+'" target="_blank" rel="noopener"><strong>'+r[0]+'</strong><p class="muted">Open documentation ↗</p></a>').join("")+'</div>'}
function cardNav(delta){let ids=cardIds();let pos=ids.indexOf(currentCard);currentCard=ids[(pos+delta+ids.length)%ids.length];revealed=false;render()}
function render(){document.getElementById("content").innerHTML=({overview,roadmap,labs:labsView,flashcards,resources})[view]();updateProgress();
document.querySelectorAll("[data-lesson]").forEach(x=>x.onchange=()=>{state.lessons[x.dataset.lesson]=x.checked;save()});
document.querySelectorAll("[data-lab]").forEach(x=>x.onchange=()=>{state.labs[x.dataset.lab]=x.checked;save()});
document.querySelectorAll("[data-go]").forEach(x=>x.onclick=()=>nav(x.dataset.go));
document.querySelectorAll("[data-openlabs]").forEach(x=>x.onclick=()=>{selectedModule=x.dataset.openlabs;nav("labs")});
let f=document.getElementById("filter");if(f)f.onchange=()=>{selectedModule=f.value;render()};
let clear=document.getElementById("clearFilter");if(clear)clear.onclick=()=>{missedOnly=false;render()};
if(view==="flashcards"&&!clear){
let topic=document.getElementById("topic");topic.onchange=()=>{selectedTopic=topic.value;missedOnly=false;currentCard=cardIds()[0];revealed=false;render()};
let el=document.getElementById("flash");const flip=()=>{revealed=!revealed;render();document.getElementById("flash").focus()};
el.onclick=flip;el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();flip()}};
document.getElementById("flip").onclick=flip;document.getElementById("prev").onclick=()=>cardNav(-1);document.getElementById("next").onclick=()=>cardNav(1);
for(let rating of ["known","missed"]){document.getElementById(rating==="known"?"known":"miss").onclick=()=>{let ids=cardIds(),pos=ids.indexOf(currentCard);state.review[currentCard]=rating;save();let next=cardIds();currentCard=next.length?next[(Math.min(pos+1,next.length-1))%next.length]:currentCard;revealed=false;render()}}
document.getElementById("shuffle").onclick=()=>{let ids=cardIds();currentCard=ids[Math.floor(Math.random()*ids.length)];revealed=false;render()};
document.getElementById("reviewMissed").onclick=()=>{missedOnly=!missedOnly;let ids=cardIds();if(ids.length)currentCard=ids[0];revealed=false;render()};
}}

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>nav(b.dataset.view));
document.getElementById("export").onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="academy-progress.json";a.click();URL.revokeObjectURL(a.href)};
document.getElementById("import").onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(!obj||typeof obj!=="object"||!obj.lessons||!obj.labs)throw Error();state={lessons:obj.lessons,labs:obj.labs,review:obj.review||{}};save();render();alert("Progress imported.")}catch(err){alert("Invalid progress file.")}};
render();
</script></body></html>
