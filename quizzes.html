<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="./favicon.svg" type="image/svg+xml"><meta name="theme-color" content="#0a1120"><title>Knowledge checks · Git Academy</title><style>
:root{color-scheme:dark;--bg:#0b1424;--panel:#14263b;--border:#344d64;--txt:#e9f3ff;--muted:#abc0d4;--accent:#68deba}
*{box-sizing:border-box}body{background:var(--bg);color:var(--txt);font:16px/1.6 system-ui,sans-serif;margin:0}button,select{font:inherit}a{color:var(--accent)}button{cursor:pointer}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #a2c3ff;outline-offset:3px}
.wrap{max-width:870px;padding:22px 18px 75px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between}.top a{text-decoration:none;font-weight:750}.tag{color:var(--muted);border:1px solid var(--border);border-radius:40px;font-size:12px;padding:4px 10px}h1{font-size:clamp(29px,4vw,44px);line-height:1.2;margin:24px 0 8px}.sub{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--border);border-radius:17px;padding:24px;margin:18px 0}.label{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.08em;text-transform:uppercase}.select{background:#273b53;color:var(--txt);border:1px solid #557087;border-radius:9px;padding:12px;width:100%;margin:10px 0}.choice{display:block;text-align:left;width:100%;background:#263c56;border:1px solid #49647b;color:var(--txt);padding:14px 15px;border-radius:10px;margin:12px 0}.choice.selected{border-color:var(--accent)}.choice:disabled{opacity:.8;cursor:default}.feedback{border-left:3px solid var(--accent);padding:12px 15px;background:#193b3c;margin-top:18px;border-radius:8px}.bad{border-left-color:#e99983;background:#392e36}.hidden{display:none}.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}.primary{background:var(--accent);color:#042d21;border:0;border-radius:9px;padding:12px 17px;font-weight:800}.secondary{background:#253b52;border:1px solid #566c82;border-radius:9px;color:var(--txt);padding:11px 16px}.meter{background:#314760;border-radius:20px;height:9px;overflow:hidden}.meter>div{background:var(--accent);width:0;height:100%}h2{font-size:23px;line-height:1.4}.muted{color:var(--muted)}@media(max-width:520px){.panel{padding:18px}}
</style></head><body><main class="wrap"><div class="top"><a href="./index.html">← Git Academy</a><span class="tag">No sign-in · Local scores</span></div><h1>Check what you actually know.</h1><p class="sub">Short quizzes with explanations, not trick questions. Answer three questions per module and see what to review next.</p>
<div class="panel"><div class="label">Choose a module</div><select class="select" id="module" aria-label="Choose a module"></select><div class="row"><span id="scoreSummary" class="muted"></span><button class="secondary" id="restart">Restart quiz</button></div></div>
<div class="panel"><div class="row"><span class="label" id="counter"></span><span class="tag" id="score"></span></div><div class="meter" style="margin:17px 0"><div id="meter"></div></div><h2 id="question"></h2><div id="choices"></div><div id="feedback" class="feedback hidden" role="status" aria-live="polite"></div><div class="row" style="margin-top:20px"><span id="hint" class="muted"></span><button id="next" class="primary hidden">Next question →</button></div></div>
<script>
const modules=[{"module":"Git fundamentals","id":1,"questions":[{"id":"1-1","q":"Which command starts tracking a new project with Git?","choices":["git init","git add","git push"],"correct":0,"reason":"git init creates the repository metadata. It does not create a commit."},{"id":"1-2","q":"You edited README.md. Which command selects it for the next commit?","choices":["git commit","git add README.md","git log"],"correct":1,"reason":"git add stages the current file content; commit records what is staged."},{"id":"1-3","q":"Which command shows what is already staged?","choices":["git diff --cached","git status --short only","git branch"],"correct":0,"reason":"git diff --cached compares the index with the current commit."}]},{"module":"History & branching","id":2,"questions":[{"id":"2-1","q":"What does a branch name point to?","choices":["A folder","A commit","A remote server"],"correct":1,"reason":"A branch is a movable reference to a commit."},{"id":"2-2","q":"Two branches change the same line incompatibly. What happens?","choices":["Git may report a conflict","Newest always wins","The file is deleted"],"correct":0,"reason":"A conflict needs a human decision; Git cannot infer business intent."},{"id":"2-3","q":"Which command safely undoes an already shared commit?","choices":["git revert","git reset --hard","git clean -fd"],"correct":0,"reason":"git revert creates a new undo commit without rewriting shared history."}]},{"module":"Working with remotes","id":3,"questions":[{"id":"3-1","q":"What does git fetch do?","choices":["Download remote changes without merging","Automatically commit edits","Delete local changes"],"correct":0,"reason":"Fetch updates remote-tracking refs, leaving your current branch unchanged."},{"id":"3-2","q":"What is origin?","choices":["The default branch name","A conventional remote name","A required Git service"],"correct":1,"reason":"origin is the common name Git gives the remote it cloned."},{"id":"3-3","q":"What does rebase do to local commits?","choices":["Replays them on a new base","Turns them into issues","Deletes all changes"],"correct":0,"reason":"Rebase replays commits and creates new commit IDs."}]},{"module":"GitHub collaboration","id":4,"questions":[{"id":"4-1","q":"Why open a pull request?","choices":["Propose changes for review","Run Git on your laptop","Create a Git repository"],"correct":0,"reason":"PRs provide a place to review diffs, discuss, and check automated tests."},{"id":"4-2","q":"What should a good PR description include?","choices":["Only a title","Purpose, scope, and test evidence","An access token"],"correct":1,"reason":"Context and verification help reviewers understand and assess changes."},{"id":"4-3","q":"What connects planned work to code changes?","choices":["Issues linked from PRs","Tags only","git status"],"correct":0,"reason":"Linked issues and PRs improve traceability."}]},{"module":"Quality & governance","id":5,"questions":[{"id":"5-1","q":"Which setting prevents a PR merge when CI fails?","choices":["Required status checks","README permissions","Local git alias"],"correct":0,"reason":"Required status checks can block merging until selected checks succeed."},{"id":"5-2","q":"What is CODEOWNERS used for?","choices":["Defining code reviewers","Storing build artifacts","Defining local Git aliases"],"correct":0,"reason":"CODEOWNERS maps paths to designated owners for review requests."},{"id":"5-3","q":"Why use a merge queue?","choices":["Validate compatible queued changes","Skip all tests","Replace Git history"],"correct":0,"reason":"It helps ensure incoming changes work together before merging."}]},{"module":"GitHub Actions basics","id":6,"questions":[{"id":"6-1","q":"Where do workflow YAML files live?","choices":[".github/workflows/","build/","README.md"],"correct":0,"reason":"GitHub discovers workflows under .github/workflows."},{"id":"6-2","q":"What is a runner?","choices":["The machine executing a job","A Git branch","A secret type"],"correct":0,"reason":"Runners execute workflow job steps."},{"id":"6-3","q":"What does workflow_dispatch enable?","choices":["Manual workflow starts","Automatic Git commits","PR approvals"],"correct":0,"reason":"workflow_dispatch permits a user-initiated run."}]},{"module":"CI pipelines","id":7,"questions":[{"id":"7-1","q":"Why use a matrix build?","choices":["Test multiple configurations","Skip requirements","Upload a repository"],"correct":0,"reason":"Matrix builds expand a job across versions or operating systems."},{"id":"7-2","q":"What does needs: build mean?","choices":["Wait for build to succeed by default","Run on the build branch","Delete build artifacts"],"correct":0,"reason":"Jobs with needs depend on specified upstream jobs."},{"id":"7-3","q":"A CI test is flaky. What is the best first action?","choices":["Investigate and reproduce","Disable the test","Rerun until green"],"correct":0,"reason":"Find evidence of timing, environment, or test isolation problems."}]},{"module":"CD and security","id":8,"questions":[{"id":"8-1","q":"How should workflow permissions be configured?","choices":["Minimum necessary","Always write-all","Use owner token for every job"],"correct":0,"reason":"Least privilege limits damage from compromised workflows."},{"id":"8-2","q":"What does OIDC help avoid?","choices":["Long-lived cloud keys in secrets","Commit messages","Unit tests"],"correct":0,"reason":"OIDC enables short-lived cloud authentication based on trusted identity claims."},{"id":"8-3","q":"What should be checked before production deployment?","choices":["Tests and approval policy","Only commit count","Git user.name"],"correct":0,"reason":"Deployment requires verified artifacts and applicable protections."}]},{"module":"Capstone & mastery","id":9,"questions":[{"id":"9-1","q":"What should happen when a deployed release fails?","choices":["Follow a verified rollback plan","Rewrite all commit history","Disable CI"],"correct":0,"reason":"A rehearsed rollback plan restores a known-good release."},{"id":"9-2","q":"What is a good definition of done?","choices":["Reviewed, tested, documented, deployable","One successful local run","PR created"],"correct":0,"reason":"Verified acceptance criteria and safe delivery matter more than activity."},{"id":"9-3","q":"What should you measure to optimize CI?","choices":["Queue, build, test, and failure time","Number of emojis in logs","Number of branches only"],"correct":0,"reason":"Separate time components to target improvements without weakening checks."}]}];const $=x=>document.getElementById(x);
const STORE="git-academy-quiz-v1";let scores={};try{scores=JSON.parse(localStorage.getItem(STORE))||{}}catch{}
let m=0,n=0,correct=0,answered=null,completed=false;
function save(){try{localStorage.setItem(STORE,JSON.stringify(scores))}catch{}}
function selectModule(i){m=i;n=0;correct=0;answered=null;completed=false;render()}
function answer(i){if(answered!==null)return;answered=i;if(i===modules[m].questions[n].correct)correct++;render()}
function next(){if(n<modules[m].questions.length-1){n++;answered=null;render()}else{scores[modules[m].id]={score:correct,total:modules[m].questions.length};completed=true;save();render()}}
function render(){let section=modules[m],q=section.questions[n],finished=completed;
$("module").innerHTML=modules.map((x,i)=>'<option value="'+i+'" '+(m===i?'selected':'')+'>'+x.id+'. '+x.module+'</option>').join("");
$("scoreSummary").textContent="Best recorded attempt: "+(scores[section.id]?scores[section.id].score+" / "+scores[section.id].total:"Not attempted");
$("counter").textContent="QUESTION "+(n+1)+" OF "+section.questions.length;$("score").textContent=correct+" correct";
$("meter").style.width=(100*(n+(answered!==null?1:0))/section.questions.length)+"%";
$("question").textContent=q.q;$("choices").innerHTML=q.choices.map((a,i)=>'<button class="choice '+(answered===i?'selected':'')+'" data-option="'+i+'" '+(answered!==null?'disabled':'')+'>'+String.fromCharCode(65+i)+'. '+a+'</button>').join("");
if(answered===null){$("feedback").className="feedback hidden";$("feedback").textContent="";$("next").classList.add("hidden");$("hint").textContent="Choose the best answer."; }
else{$("feedback").className="feedback "+(answered===q.correct?"":"bad");$("feedback").textContent=(answered===q.correct?"✓ Correct. ":"Not quite. The correct answer is "+q.choices[q.correct]+". ")+q.reason;$("next").classList.remove("hidden");$("next").textContent=n===section.questions.length-1?"Finish & save score":"Next question →";$("hint").textContent="Learn from the explanation before continuing.";}
if(finished){$("feedback").textContent="Quiz completed: "+correct+" / "+section.questions.length+". "+(correct===section.questions.length?"Great understanding!":"Review the topics you missed, then retry.");$("next").classList.add("hidden");}
document.querySelectorAll("[data-option]").forEach(x=>x.onclick=()=>answer(Number(x.dataset.option)));
}
$("module").onchange=e=>selectModule(Number(e.target.value));$("restart").onclick=()=>selectModule(m);$("next").onclick=next;render();
</script></main></body></html>
